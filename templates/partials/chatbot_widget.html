<section class="chatbot-widget" aria-label="Website chatbot">
    <button class="chatbot-toggle" type="button" aria-label="Open chat" aria-expanded="false">
        <span class="chatbot-toggle-icon" aria-hidden="true">?</span>
    </button>

    <div class="chatbot-panel" aria-hidden="true">
        <header class="chatbot-header">
            <div>
                <p class="chatbot-kicker">Offline assistant</p>
                <h2>NovaMart Help</h2>
            </div>
            <button class="chatbot-close" type="button" aria-label="Close chat">&times;</button>
        </header>

        <div class="chatbot-messages" role="log" aria-live="polite" aria-relevant="additions">
            <div class="chatbot-message chatbot-message-bot">
                Hi, ask me about products, policies, orders, or website information.
            </div>
        </div>

        <div class="chatbot-typing" hidden>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <form class="chatbot-form">
            <label class="visually-hidden" for="chatbot-input">Message</label>
            <input
                id="chatbot-input"
                class="chatbot-input"
                type="text"
                name="message"
                placeholder="Ask a question..."
                autocomplete="off"
                maxlength="500"
            >
            <button class="chatbot-send" type="submit">Send</button>
        </form>
    </div>
</section>
