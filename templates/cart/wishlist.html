{% extends "base.html" %}
{% block title %}Wishlist - NovaMart{% endblock %}
{% block content %}
<section class="page-header compact">
    <div class="container"><span class="eyebrow">Wishlist</span><h1>Saved Products</h1></div>
</section>
<section class="container section-block">
    <div class="row g-4">
        {% for item in items %}
        <div class="col-6 col-lg-3">{% with product=item.product %}{% include "partials/product_card.html" %}{% endwith %}</div>
        {% empty %}
        <div class="col-12"><div class="empty-state">Your wishlist is empty.</div></div>
        {% endfor %}
    </div>
</section>
{% endblock %}
